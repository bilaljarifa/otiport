# ============================================================================
#  Optiport — Streamlit theme configuration
#  This file is the *first layer* of the design system: it maps the design
#  tokens defined in ui/tokens.py onto Streamlit's native theming engine so
#  that built-in widgets (buttons, inputs, dataframes, metrics, charts) match
#  the custom components without any CSS override.
#  Keep in sync with ui/tokens.py.
# ============================================================================

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[logger]
level = "warning"

# ---------------------------------------------------------------------------
#  Core theme — "Terminal" light financial palette (primary experience).
#  "Midnight"/"Graphite" remain selectable from Settings — see ui/tokens.py —
#  but native Streamlit widgets always follow this base theme; ui/styles.py's
#  CSS variables layer on top for the custom .opt-* components.
# ---------------------------------------------------------------------------
[theme]
base = "light"

# Surfaces
backgroundColor = "#FFFFFF"          # app background
secondaryBackgroundColor = "#F4F4F5" # cards, inputs, code blocks
textColor = "#0A0A0A"
primaryColor = "#0A0A0A"

# Borders & separators
borderColor = "#E4E4E7"
dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#FAFAFA"
showWidgetBorder = true
showSidebarBorder = false

# Links
linkColor = "#0A0A0A"
linkUnderline = true

# Radius scale — crisp, institutional corners, not the rounded "app" look.
baseRadius = "0.375rem"
buttonRadius = "0.25rem"

# Typography — Inter loaded from Google Fonts with system fallbacks.
# If the CDN is unreachable the stack degrades to the platform UI font.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, Inter, Segoe UI, Roboto, Helvetica Neue, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, Inter, Segoe UI, Roboto, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap, JetBrains Mono, SFMono-Regular, Consolas, monospace"

baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["1.875rem", "1.5rem", "1.125rem", "1rem", "0.875rem", "0.8125rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]

metricValueFontSize = "1.75rem"
metricValueFontWeight = 700

# Semantic colors — used by st.metric deltas, st.badge, alerts and
# markdown color syntax so that every signal reads the same everywhere.
# Green/red are reserved for market up/down; nothing else uses hue as decoration.
greenColor = "#16A34A"
redColor = "#DC2626"
orangeColor = "#D97706"
yellowColor = "#CA8A04"
blueColor = "#0369A1"
violetColor = "#6D28D9"
grayColor = "#71717A"

greenTextColor = "#15803D"
redTextColor = "#B91C1C"
orangeTextColor = "#B45309"
blueTextColor = "#075985"
violetTextColor = "#5B21B6"
grayTextColor = "#52525B"

greenBackgroundColor = "#F0FDF4"
redBackgroundColor = "#FEF2F2"
orangeBackgroundColor = "#FFFBEB"
yellowBackgroundColor = "#FEFCE8"
blueBackgroundColor = "#F0F9FF"
violetBackgroundColor = "#F5F3FF"
grayBackgroundColor = "#FAFAFA"

codeTextColor = "#0A0A0A"
codeBackgroundColor = "#F4F4F5"

# Chart palettes — every chart in the app pulls from these so series colors
# stay identical between Plotly, Altair and Streamlit native charts.
chartCategoricalColors = [
  "#3B82F6", "#22C55E", "#F59E0B", "#8B5CF6", "#06B6D4", "#EC4899",
  "#14B8A6", "#F97316", "#6366F1", "#84CC16", "#A855F7", "#0EA5E9",
]
chartSequentialColors = [
  "#0B1F3A", "#12325C", "#1A467F", "#215BA2", "#2970C5", "#3B82F6",
  "#5B9BF8", "#8CBAFB", "#BDD7FD", "#E3EDFE",
]
chartDivergingColors = [
  "#7F1D1D", "#B91C1C", "#EF4444", "#F87171", "#FCA5A5", "#E2E8F0",
  "#86EFAC", "#4ADE80", "#22C55E", "#15803D", "#14532D",
]

# ---------------------------------------------------------------------------
#  Sidebar — deliberately kept dark against the light app body: a dark nav
#  rail around a light workspace is a common, professional institutional
#  pattern (not a leftover of the old all-dark theme).
# ---------------------------------------------------------------------------
[theme.sidebar]
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#171717"
textColor = "#E4E4E7"
primaryColor = "#FFFFFF"
borderColor = "#27272A"
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = false
