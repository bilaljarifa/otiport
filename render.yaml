# Render Blueprint for the Optiport FastAPI backend.
#
# This only encodes build/start commands and a persistent disk — it does
# NOT contain any secret values. Every `sync: false` variable must be typed
# into the Render dashboard by hand after the first deploy (Render will
# prompt for each one); nothing here is committed as a real credential.
#
# A paid Render instance type is required: the free tier does not support
# attached persistent disks, and without one both the SQLite database and
# the LSTM model files would be wiped on every redeploy/restart. See
# DEPLOYMENT.md for the full checklist and rationale.

services:
  - type: web
    name: optiport-api
    runtime: python
    plan: starter  # any plan that supports a persistent disk; adjust as needed
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: optiport-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        value: sqlite:////var/data/optiport.db
      - key: LSTM_MODEL_DIR
        value: /var/data/lstm_models
      - key: AUTH_SECRET_KEY
        sync: false
      - key: AUTH_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # "Continue with Google" on Login — all three required together, or
      # the button stays hidden. GOOGLE_REDIRECT_URI must exactly match an
      # Authorized redirect URI on the Google Cloud OAuth client, AND point
      # at THIS backend, not the frontend — GET /auth/google/callback is a
      # real FastAPI route (e.g. https://optiport-api.onrender.com/auth/google/callback).
      # FRONTEND_URL is where that route redirects the browser back to
      # afterwards (success or failure) — set to the Vercel domain.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
