<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Optiport">
  <!-- Geometric mark: three ascending bars inside a precise square frame —
       reads as "portfolio composition" / "market data", not a stock arrow. -->
  <rect x="3" y="3" width="26" height="26" rx="5" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="9"    y="18" width="3.4" height="7"  fill="#fff"/>
  <rect x="14.3" y="13" width="3.4" height="12" fill="#fff"/>
  <rect x="19.6" y="8"  width="3.4" height="17" fill="#fff"/>
</svg>
