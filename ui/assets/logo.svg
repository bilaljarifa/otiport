<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 32" width="172" height="32" role="img" aria-label="Optiport">
  <!-- Same geometric mark as logo-mark.svg (three ascending bars inside a
       square frame) paired with a plain, bold, letter-spaced wordmark —
       monochrome, no gradients, no stock-arrow cliché. -->
  <rect x="1" y="1" width="26" height="26" rx="5" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="7"    y="16" width="3.2" height="7"  fill="#fff"/>
  <rect x="12.1" y="11" width="3.2" height="12" fill="#fff"/>
  <rect x="17.2" y="6"  width="3.2" height="17" fill="#fff"/>

  <text x="36" y="21" font-family="Inter, 'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="800" letter-spacing="0.5" fill="#fff">OPTIPORT</text>
</svg>
